name: Update daily news brief

on:
  # 06:00 UTC = 07:00 BST (UK summer) / 06:00 GMT (UK winter) — close to 7am UK year-round
  schedule:
    - cron: '0 6 * * *'
  # also allow manual trigger from the Actions tab
  workflow_dispatch:

permissions:
  contents: write  # needed so the action can commit data.json back to the repo

jobs:
  refresh-brief:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python pipeline.py

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --staged --quiet; then
            echo "No changes to data.json — skipping commit."
          else
            git commit -m "Update brief $(date -u +%Y-%m-%d)"
            git push
          fi
